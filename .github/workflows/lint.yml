name: Go-only Super-Linter

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write
  statuses: write

jobs:
  lint:
    name: Go-only Super-Linter
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Go-only Super-Linter image
        run: docker build -t go-superlinter -f Dockerfile .

      - name: Run Go-only Super-Linter
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/tmp/lint" \
            -w /tmp/lint \
            -e RUN_LOCAL=true \
            -e VALIDATE_ALL_CODEBASE=false \
            -e VALIDATE_GO=true \
            -e DEFAULT_BRANCH=main \
            -e GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            go-superlinter
